<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111" />
  <link rel="manifest" href="./manifest.json" />
  <title>-40℃ サバイバル</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#0b0d12;color:#fff}
    .wrap{max-width:520px;margin:0 auto;padding:16px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
    .card{background:#131826;border:1px solid #232a3b;border-radius:14px;padding:14px}
    .title{font-size:18px;font-weight:700}
    .desc{opacity:.9;line-height:1.55}
    .choices{display:flex;flex-direction:column;gap:10px}
    button{border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:700;background:#2a3350;color:#fff}
    button:active{transform:scale(.99)}
    .bar{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .muted{opacity:.7;font-size:13px}
    .ok{color:#7CFFB2}
    .ng{color:#FF7C7C}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="title">-40℃ サバイバル</div>
      <div class="muted">Day <span id="day">1</span></div>
    </div>

    <div class="card">
      <div class="desc" id="sceneText">読み込み中…</div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="card" id="resultCard" style="display:none;">
      <div class="title" id="resultTitle"></div>
      <div class="desc" id="resultMsg"></div>
      <div style="margin-top:10px;display:flex;gap:10px;">
        <button id="nextBtn" style="flex:1;">次へ</button>
        <button id="retryBtn" style="flex:1;display:none;">リトライ</button>
      </div>
    </div>

    <div class="muted">ホーム画面に追加すると“アプリっぽく”動きます（PWA）</div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
